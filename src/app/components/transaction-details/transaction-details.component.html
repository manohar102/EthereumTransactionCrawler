<div class="table-container">
  <table mat-table *ngIf="dataSource" [dataSource]="dataSource" class="transaction-table mat-elevation-z8">
      <ng-container matColumnDef="blockNumber">
        <th mat-header-cell *matHeaderCellDef> Block # </th>
        <td mat-cell *matCellDef="let element"> {{element.blockNumber}} </td>
      </ng-container>
      <ng-container matColumnDef="from">
        <th mat-header-cell *matHeaderCellDef> From </th>
        <td mat-cell *matCellDef="let element" class="address-cell" [title]="element.from"> {{element.from}} </td>
      </ng-container>
      <ng-container matColumnDef="to">
        <th mat-header-cell *matHeaderCellDef> To </th>
        <td mat-cell *matCellDef="let element" class="address-cell" [title]="element.to"> {{element.to}} </td>
      </ng-container>
      <ng-container matColumnDef="value">
        <th mat-header-cell *matHeaderCellDef> ETH (Wei) </th>
        <td mat-cell *matCellDef="let element"> {{element.value}} </td>
      </ng-container>
      <ng-container matColumnDef="gas">
        <th mat-header-cell *matHeaderCellDef> Gas Limit </th>
        <td mat-cell *matCellDef="let element"> {{element.gas}} </td>
      </ng-container>
      <ng-container matColumnDef="gasPrice">
        <th mat-header-cell *matHeaderCellDef> Gas Price (Wei) </th>
        <td mat-cell *matCellDef="let element"> {{element.gasPrice}} </td>
      </ng-container>
      <ng-container matColumnDef="gasUsed">
        <th mat-header-cell *matHeaderCellDef> Gas Used </th>
        <td mat-cell *matCellDef="let element"> {{element.gasUsed}} </td>
      </ng-container>
      <ng-container matColumnDef="cumulativeGasUsed">
        <th mat-header-cell *matHeaderCellDef> Cumulative Gas Used </th>
        <td mat-cell *matCellDef="let element"> {{element.cumulativeGasUsed}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
<mat-paginator #paginator [pageSize]="pageSize" [length]="totalSize"
[pageIndex]="currentPage" (page)="handlePage($event)" aria-label="Select page"></mat-paginator>
