<div class="content" role="banner">
  <mat-card>
    <mat-card-header >
      <h2>Transaction</h2>
    </mat-card-header>
    <mat-card-content>
      <form >
        <mat-error *ngIf="error">
          {{error}}
        </mat-error>
        <mat-form-field appearance="outline" class="inputFields">
          <mat-label>Transaction address</mat-label>
          <input matInput type="text" [(ngModel)]="transaction.transactionId" name="transactionId" #inp='ngModel' minlength="8" autofocus required>
          <mat-error>
            <div *ngIf="inp.invalid && (inp.dirty || inp.touched)" class="alert">
              <div *ngIf="inp.errors?.['required']">
                Transaction address is required
              </div>
              <div *ngIf="inp.errors?.['minlength']">
                Email is too short.
              </div>
            </div>
          </mat-error>
        </mat-form-field>
        &nbsp;
        <mat-form-field appearance="outline" class="inputFields">
          <mat-label>Block number</mat-label>
          <input matInput  type="text" [(ngModel)]="transaction.startBlock" name="startBlock" #inp2='ngModel'>
        </mat-form-field>
        &nbsp;
        <br>
        <section class="example-section">
          <mat-checkbox class="example-margin"  [(ngModel)]="checked" name="toggleDate">Select date range</mat-checkbox>
        </section>
        <br>
        <div class="flex flex-arround" *ngIf="checked">
          <mat-form-field class="example-full-width" appearance="fill">
            <mat-label>Start date</mat-label>
            <input type="date" matInput placeholder="Start date" [(ngModel)]="transaction.startDate" name="startDate" [min]="today|date: 'yyyy-MM-dd'">
          </mat-form-field>
          &nbsp;
          <mat-form-field class="example-full-width" appearance="fill">
            <mat-label>End date</mat-label>
            <input type="date" matInput placeholder="End date" [(ngModel)]="transaction.endDate" name="endDate" [min]="nextDay|date: 'yyyy-MM-dd'">
          </mat-form-field>
          <br>
        </div>
        <button mat-raised-button color="primary" (click)="onSubmit()">Check Balance</button>
        <br>
      </form>
    </mat-card-content>
  </mat-card>
  <app-transaction-details 
  [transactions]="transactions"></app-transaction-details>
</div>
