<table mat-table *ngIf="transactions" [dataSource]="transactions.result" class="transaction-table mat-elevation-z8">
    <ng-container matColumnDef="from">
      <th mat-header-cell *matHeaderCellDef> Transaction from. </th>
      <td mat-cell *matCellDef="let element"> {{element.from}} </td>
    </ng-container>
    <ng-container matColumnDef="to">
      <th mat-header-cell *matHeaderCellDef> Transaction to. </th>
      <td mat-cell *matCellDef="let element"> {{element.to}} </td>
    </ng-container>
    <ng-container matColumnDef="value">
      <th mat-header-cell *matHeaderCellDef> ETH </th>
      <td mat-cell *matCellDef="let element"> {{element.value}} </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
